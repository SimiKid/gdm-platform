## Base stack — no host port mappings here.
## Dev ports live in docker-compose.override.yml (picked up automatically);
## production runs `docker compose -f docker-compose.yml -f docker-compose.prod.yml`
## and exposes only the Caddy reverse proxy on 80/443.

services:
  # ── Matrix Synapse ────────────────────────────────────
  synapse:
    # Pin the version currently validated in production/integration tests;
    # upgrade deliberately so a deploy cannot silently change Matrix behavior.
    image: matrixdotorg/synapse:v1.157.2
    restart: unless-stopped
    labels:
      # Production deploy.sh injects the rendered config hash. A changed bind
      # mount alone does not make Compose recreate a container.
      gdm.synapse-config-sha: ${SYNAPSE_CONFIG_SHA:-development}
    volumes:
      - synapse-data:/data
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./synapse/log.config:/data/log.config:ro
      # STUB: uncomment when the bot appservice lands
      # - ./appservice/registration.yaml:/data/appservice-registration.yaml:ro
    environment:
      UID: "0"
      GID: "0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      synapse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Synapse PostgreSQL ────────────────────────────────
  synapse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SYNAPSE_DB_NAME}
      POSTGRES_USER: ${SYNAPSE_DB_USER}
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNAPSE_DB_USER} -d ${SYNAPSE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Research PostgreSQL ──────────────────────────────
  research-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RESEARCH_DB_NAME}
      POSTGRES_USER: ${RESEARCH_DB_USER}
      POSTGRES_PASSWORD: ${RESEARCH_DB_PASSWORD}
    volumes:
      - research-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESEARCH_DB_USER} -d ${RESEARCH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Session Manager ───────────────────────────────────
  session-manager:
    build:
      context: ..
      dockerfile: backend/session-manager/Dockerfile
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      GDM_ENV: ${GDM_ENV:-development}
      PORT: "3001"
      MATRIX_INTERNAL_URL: http://synapse:8008
      MATRIX_PUBLIC_URL: ${MATRIX_PUBLIC_URL:-http://localhost:3000}
      MATRIX_SERVICE_PASSWORD: ${MATRIX_SERVICE_PASSWORD:-gdm-dev-orchestrator-password}
      CHAT_SERVICE_URL: http://chat-service:3002
      DATABASE_URL: postgresql://${RESEARCH_DB_USER}:${RESEARCH_DB_PASSWORD}@research-db:5432/${RESEARCH_DB_NAME}?schema=public
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      WAITING_TIMEOUT_MINUTES: ${WAITING_TIMEOUT_MINUTES:-30}
      PROLIFIC_STUDY_ID: ${PROLIFIC_STUDY_ID:-}
      PROLIFIC_API_TOKEN: ${PROLIFIC_API_TOKEN:-}
      MATRIX_RATE_LIMIT_RETRIES: ${MATRIX_RATE_LIMIT_RETRIES:-8}
      MATRIX_RETRY_MAX_DELAY_MS: ${MATRIX_RETRY_MAX_DELAY_MS:-30000}
      MATRIX_REQUEST_TIMEOUT_MS: ${MATRIX_REQUEST_TIMEOUT_MS:-15000}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      synapse:
        condition: service_healthy
      research-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Chat Service / Bot Runtime ────────────────────────
  chat-service:
    build:
      context: ..
      dockerfile: backend/chat-service/Dockerfile
    restart: unless-stopped
    # Lets the shutdown hook finish in-flight classifiers/checkpoints and send
    # one final monotonic snapshot before the container is killed.
    stop_grace_period: 75s
    environment:
      GDM_ENV: ${GDM_ENV:-development}
      PORT: "3002"
      MATRIX_INTERNAL_URL: http://synapse:8008
      SESSION_MANAGER_URL: http://session-manager:3001/api
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      LLM_MODE: ${LLM_MODE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      CHECKPOINT_TIMEOUT_MS: ${CHECKPOINT_TIMEOUT_MS:-30000}
      MATRIX_RATE_LIMIT_RETRIES: ${MATRIX_RATE_LIMIT_RETRIES:-8}
      MATRIX_RETRY_MAX_DELAY_MS: ${MATRIX_RETRY_MAX_DELAY_MS:-30000}
      MATRIX_REQUEST_TIMEOUT_MS: ${MATRIX_REQUEST_TIMEOUT_MS:-15000}
      MATRIX_SYNC_REQUEST_TIMEOUT_MS: ${MATRIX_SYNC_REQUEST_TIMEOUT_MS:-40000}
      MODERATION: ${MODERATION:-off}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      synapse:
        condition: service_healthy
      session-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Participant Frontend ──────────────────────────────
  participant:
    build:
      context: ..
      dockerfile: frontend/participant/Dockerfile
      args:
        VITE_MATRIX_HOMESERVER: /
        VITE_SESSION_MANAGER_URL: /api
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
      session-manager:
        condition: service_healthy

  # ── Researcher Admin Dashboard ────────────────────────
  admin-dashboard:
    build:
      context: ..
      dockerfile: frontend/admin-dashboard/Dockerfile
      args:
        VITE_SESSION_MANAGER_URL: /api
        # Absolute URL participants use to reach the study; shown as the
        # recruiting link in the dashboard.
        VITE_PARTICIPANT_URL: ${PARTICIPANT_PUBLIC_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      session-manager:
        condition: service_healthy

volumes:
  synapse-data:
  synapse-db-data:
  research-db-data:
