## Production overlay for gdmproject.ifi.uzh.ch.
##
##   docker compose --env-file .env \
##     -f docker-compose.yml -f docker-compose.prod.yml up --build -d
##
## Only Caddy is publicly exposed (80/443, auto-TLS via Let's Encrypt).
## The admin dashboard is routed by Caddy at /admin/ and remains bound to
## localhost as an SSH-tunnel fallback. Its API calls require ADMIN_API_TOKEN.
##
## Before first start: render the Synapse config (sh render-homeserver.sh) —
## server_name is immutable once Synapse has started.
##
## App images come from GHCR (built by .github/workflows/build-images.yml);
## the VM never builds. deploy.sh runs `pull` + `up -d --no-build`.
## IMAGE_TAG pins a build (git sha) for rollbacks; defaults to latest.

services:
  # ── Reverse Proxy / TLS termination ───────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      participant:
        condition: service_started
      admin-dashboard:
        condition: service_started
      session-manager:
        condition: service_healthy

  # ── Synapse: use the rendered production config ───────
  # (same target path as the dev mount in docker-compose.yml → replaces it)
  synapse:
    volumes:
      - ./synapse/homeserver.prod.yaml:/data/homeserver.yaml:ro

  # ── App services: pull prebuilt images from GHCR ──────
  session-manager:
    image: ${IMAGE_PREFIX:-ghcr.io/simikid/gdm-platform}/session-manager:${IMAGE_TAG:-latest}

  chat-service:
    image: ${IMAGE_PREFIX:-ghcr.io/simikid/gdm-platform}/chat-service:${IMAGE_TAG:-latest}

  participant:
    image: ${IMAGE_PREFIX:-ghcr.io/simikid/gdm-platform}/participant:${IMAGE_TAG:-latest}

  # ── Admin dashboard: Caddy + SSH-tunnel fallback ──────
  admin-dashboard:
    image: ${IMAGE_PREFIX:-ghcr.io/simikid/gdm-platform}/admin-dashboard:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3003:80"

volumes:
  caddy-data:
  caddy-config:
