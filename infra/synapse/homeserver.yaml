## GDM Study Platform – Synapse Configuration
## Minimal config for local development

server_name: "localhost"
pid_file: /data/homeserver.pid
report_stats: false

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false

# ── Database ──────────────────────────────────────────
database:
  name: psycopg2
  args:
    # These must match SYNAPSE_DB_* values in .env
    user: synapse
    password: synapse_secret
    database: synapse
    host: synapse-db
    port: 5432
    cp_min: 5
    cp_max: 10

# ── Logging ───────────────────────────────────────────
log_config: "/data/log.config"

# ── Media store ───────────────────────────────────────
media_store_path: /data/media_store

# ── Registration ──────────────────────────────────────
# Open registration for study participants (local dev only!)
enable_registration: true
enable_registration_without_verification: true

# ── Signing key ───────────────────────────────────────
signing_key_path: "/data/localhost.signing.key"

# ── Trusted key servers (none for local dev) ──────────
trusted_key_servers: []
suppress_key_server_warning: true

# ── Room defaults ─────────────────────────────────────
# Disable encryption by default so study rooms stay readable
encryption_enabled_by_default_for_room_type: "off"

# ── Application services (Bot / Rule Engine) ──────────
# STUB: uncomment when the bot appservice lands. Synapse loads the bot's
# registration file from here; the file must be mounted into this container
# (see the matching volume stub in docker-compose.yml).
# app_service_config_files:
#   - /data/appservice-registration.yaml

# ── Rate limiting (relaxed for study sessions) ────────
rc_message:
  per_second: 10
  burst_count: 50

rc_login:
  address:
    per_second: 5
    burst_count: 20
  account:
    per_second: 5
    burst_count: 20

# Participant accounts all arrive from the Session Manager's one Docker IP.
# Size the bucket for the largest benchmark wave; production blocks this API
# at Caddy, so only the internal service can use the relaxed registration rate.
rc_registration:
  per_second: 50
  burst_count: 300

# Every group needs a private room created by the same internal orchestrator.
# Synapse's default (burst 10, then roughly one room/minute) cannot support a
# study recruitment wave. A 249-person run creates up to 83 rooms.
rc_room_creation:
  per_second: 5
  burst_count: 100

# The same service bot is invited into every study room. Synapse's default
# recipient limit allows only five rapid invites and then blocks new groups
# for several minutes. External registration is blocked in production and
# study rooms reserve invitation power for the orchestrator. The issuer burst
# covers one 249-person wave (participants + recorder bots) without retries.
rc_invites:
  per_room:
    per_second: 10
    burst_count: 50
  per_user:
    per_second: 20
    burst_count: 100
  per_issuer:
    per_second: 50
    # 249 participants + primary recorder + both comparison bots = 498.
    burst_count: 600

# The primary recorder (and, in comparison mode, each named bot) joins one
# room per group. Synapse's default per-account burst of 10 would throttle the
# recorder after only 30 participants; 249 participants need up to 83 joins.
rc_joins:
  local:
    per_second: 25
    burst_count: 100
  # No remote rooms are part of the study, so keep the conservative default.
  remote:
    per_second: 0.01
    burst_count: 10
