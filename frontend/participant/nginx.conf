server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA: serve index.html for all routes
    # Only the editor shell, assets, and authenticated collaboration socket are public.
    location ~ "^/etherpad/(?:p/gdm-[a-f0-9-]{36}$|static/|javascripts/|socket.io/|locales/|locales.json$|pluginfw/plugin-definitions.json$|padbootstrap-[A-Za-z0-9]+\.min\.js$)" {
        # Socket.IO carries the short-lived pad grant in its handshake query.
        access_log off;
        set $etherpad_upstream http://etherpad:9001;
        rewrite ^/etherpad/(.*)$ /$1 break;
        proxy_pass $etherpad_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
    }
    location /etherpad/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Matrix API calls to Synapse (avoids CORS issues)
    location /_matrix/ {
        set $synapse_upstream http://synapse:8008;
        proxy_pass $synapse_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Session Manager API calls
    location /api/ {
        set $session_manager_upstream http://session-manager:3001;
        proxy_pass $session_manager_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
